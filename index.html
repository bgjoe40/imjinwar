<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>임진왜란 전쟁사 지도</title>
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="seal">壬辰</span>
      <div>
        <h1>임진왜란 · 정유재란</h1>
        <p>1592 – 1598 칠년 전쟁 연대기</p>
      </div>
    </div>
    <div class="top-controls">
      <button id="btnPrev" class="btn" title="이전 사건 (↑)">◀ 이전</button>
      <button id="btnAuto" class="btn" title="연대기 자동 재생">▶ 연대기 재생</button>
      <button id="btnNext" class="btn" title="다음 사건 (↓)">다음 ▶</button>
      <button id="btnSources" class="btn" title="사료와 참고 자료">📖 자료</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-tabs" id="sideTabs" role="tablist">
        <button data-tab="timeline" class="on" role="tab">연대기</button>
        <button data-tab="people" role="tab">인물</button>
        <button data-tab="codex" role="tab">무기·전술</button>
      </div>
      <div class="side-pane" id="pane-timeline">
        <div class="sidebar-head">
          <span>주요 사건 · 전투</span>
          <span class="legend-mini"><i class="t-land"></i>육전 <i class="t-sea"></i>해전 <i class="t-siege"></i>공성 <i class="t-event"></i>사건</span>
        </div>
        <div id="timeline" class="timeline"></div>
      </div>
      <div class="side-pane hidden" id="pane-people">
        <div class="side-search"><input id="peopleSearch" type="search" placeholder="이름·직책 검색 (예: 이순신, 의병장)"></div>
        <div id="peopleList" class="item-list"></div>
      </div>
      <div class="side-pane hidden" id="pane-codex">
        <div id="codexList" class="item-list"></div>
      </div>
    </aside>

    <section class="center">
      <div id="map"></div>

      <div class="map-legend" id="mapLegend">
        <div><i style="background:var(--joseon)"></i>조선 지배</div>
        <div><i style="background:var(--japan)"></i>일본 점령</div>
        <div><i class="line" style="background:var(--japan)"></i>일본군 진격로</div>
        <div><i class="line" style="background:var(--ming)"></i>명군 진격로</div>
      </div>

      <div class="terrain-switch hidden" id="terrainSwitch">
        <span class="ts-title">지형</span>
        <button data-mode="now" class="on" title="오늘날 위성 사진">현재</button>
        <button data-mode="past" title="1590년대 추정 지형 (옛 해안선·성곽·논밭 복원)">1590년대 추정</button>
        <button data-mode="compare" title="좌우로 끌어서 비교">비교</button>
      </div>

      <div class="terrain-legend hidden" id="terrainLegend">
        <div class="tl-title">1590년대 추정 지형</div>
        <div><i class="tl-water"></i>바다·강 (매립 전 추정 해안선)</div>
        <div><i class="tl-wall"></i>성곽 (추정 위치)</div>
        <div><i class="tl-field"></i>논·습지·들판</div>
        <div><i class="tl-road"></i>옛길</div>
      </div>

      <div class="event-card" id="eventCard"></div>

      <div class="battle-hud hidden" id="battleHud">
        <div class="narr">
          <div class="narr-head">
            <span class="narr-time" id="narrTime"></span>
            <span class="narr-title" id="narrTitle"></span>
            <span class="narr-step" id="narrStep"></span>
          </div>
          <p class="narr-text" id="narrText"></p>
          <blockquote class="narr-quote hidden" id="narrQuote"></blockquote>
        </div>
        <div class="controls">
          <button class="btn icon" id="bRestart" title="처음부터">⏮</button>
          <button class="btn icon" id="bPrevPh" title="이전 단계">⏪</button>
          <button class="btn icon primary" id="bPlay" title="재생/일시정지 (Space)">▶</button>
          <button class="btn icon" id="bNextPh" title="다음 단계">⏩</button>
          <div class="scrub" id="scrub"><div class="scrub-fill" id="scrubFill"></div><div class="scrub-ticks" id="scrubTicks"></div></div>
          <select id="bSpeed" class="btn" title="재생 속도">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
          <button class="btn" id="bExit">전략 지도로 ✕</button>
        </div>
      </div>

      <div class="battle-banner hidden" id="battleBanner"></div>
    </section>

    <aside class="panel" id="panel"></aside>
  </main>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-head"><h2 id="modalTitle"></h2><button class="btn" id="modalClose">닫기 ✕</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data-events.js?v=6"></script>
  <script src="js/data-battles.js?v=6"></script>
  <script src="js/data-terrain.js?v=6"></script>
  <script src="js/data-sources.js?v=6"></script>
  <script src="js/data-people.js?v=6"></script>
  <script src="js/data-codex.js?v=6"></script>
  <script src="js/terrain.js?v=6"></script>
  <script src="js/battle.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
